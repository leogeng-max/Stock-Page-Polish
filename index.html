<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prediction — Redesign Iterations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — extracted verbatim from Post-MVP II 3.0
   ============================================================ */
:root{
  --bg:#000000;
  --hairline:#1c1c1c;
  --hairline-soft:rgba(255,255,255,.06);
  --rule:#737373;

  --text:#ffffff;
  --text-2:#c7c7c7;   /* Color / Neutral / 400 */
  --text-3:#929292;
  --text-4:#565b5e;

  --pad:20px;

  /* stage (outside the phone — not part of the product design system) */
  --stage:#141414;
  --stage-2:#1b1b1b;
  --stage-line:#2c2c2c;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--stage);
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============================================================
   STAGE + BURGER NAV
   ============================================================ */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}

.burger{
  position:fixed;top:14px;left:14px;z-index:60;
  width:42px;height:42px;border-radius:10px;
  background:var(--stage-2);border:1px solid var(--stage-line);
  display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;
}
.burger i{display:block;width:16px;height:1.5px;background:var(--text-2);border-radius:2px;transition:.18s}
.burger:hover i{background:#fff}
.nav-open .burger i:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.nav-open .burger i:nth-child(2){opacity:0}
.nav-open .burger i:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

.reset-btn{
  position:fixed;top:14px;left:64px;z-index:60;
  width:42px;height:42px;border-radius:10px;
  background:var(--stage-2);border:1px solid var(--stage-line);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;color:var(--text-2);transition:.18s;
}
.reset-btn:hover{color:#fff;border-color:#555}
.reset-btn:active{transform:rotate(-180deg)}
.reset-btn svg{width:17px;height:17px;display:block}
.reset-hint{
  position:fixed;top:24px;left:116px;z-index:60;
  font-size:10px;letter-spacing:1.2px;color:var(--text-4);
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.reset-hint.show{opacity:1;color:var(--text-2)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.22s;z-index:40}
.nav-open .scrim{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;left:0;bottom:0;width:308px;z-index:50;
  background:var(--stage-2);border-right:1px solid var(--stage-line);
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.nav-open .drawer{transform:none}
.drawer-hd{padding:66px 20px 14px;border-bottom:1px solid var(--stage-line)}
.drawer-hd h2{font-size:13px;font-weight:500;letter-spacing:-.1px}
.drawer-hd p{font-size:10.5px;font-weight:400;color:var(--text-4);letter-spacing:.9px;text-transform:uppercase;margin-top:5px}
.drawer-list{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{
  display:block;width:100%;text-align:left;padding:11px 20px;
  border-left:2px solid transparent;transition:.14s;
}
.nav-item:hover{background:rgba(255,255,255,.03)}
.nav-item.on{border-left-color:#fff;background:rgba(255,255,255,.05)}
.nav-item b{display:block;font-size:12.5px;font-weight:500;color:var(--text-2)}
.nav-item.on b{color:#fff}
.nav-item s{display:block;font-size:10.5px;font-weight:300;color:var(--text-4);text-decoration:none;margin-top:3px;line-height:1.45}
.drawer-ft{padding:12px 20px 18px;border-top:1px solid var(--stage-line);display:flex;gap:8px}
.mini-btn{flex:1;padding:8px;border:1px solid var(--stage-line);border-radius:8px;font-size:11px;color:var(--text-3);transition:.14s}
.mini-btn:hover{color:#fff;border-color:#555}

/* caption above the phone */
.caption{text-align:center;max-width:520px}
.caption h3{font-size:12.5px;font-weight:500;letter-spacing:.2px}
.caption p{font-size:11px;font-weight:300;color:var(--text-3);margin-top:4px;line-height:1.5}
.caption .shortcuts{font-size:9.5px;letter-spacing:1.1px;color:#4a4a4a;margin-top:7px}
.caption .shortcuts b{font-weight:500;color:var(--text-4)}

/* ============================================================
   PHONE FRAME
   ============================================================ */
.phone{
  width:393px;flex:0 1 852px;height:852px;max-height:calc(100vh - 130px);
  background:var(--bg);border:1px solid #2a2a2a;border-radius:26px;
  overflow:hidden;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
.screen{display:none;flex-direction:column;height:100%}
.screen.on{display:flex}

/* ---------- shared chrome ---------- */
.navbar{height:58px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--hairline)}
.navbar .chev{font-size:22px;line-height:22px;font-weight:400;color:#fff;width:24px;text-align:center}

.body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.body::-webkit-scrollbar{width:0}

.hd{padding:14px var(--pad) 0;position:relative}
/* info icon — exported asset from node 4047:701, geometry preserved at 12.0489px */
.hd .info{position:absolute;right:16.88px;top:1px;width:12.0489px;height:12.0489px;display:block}
.hd .info svg{display:block;width:12.0489px;height:12.0489px}
.hd-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0 16px;border-bottom:1px solid var(--hairline-soft)}
.hd h1{font-size:18px;font-weight:400;letter-spacing:-.36px;line-height:21.6px}
.hd .stepno{font-size:11px;font-weight:400;color:var(--text-3);letter-spacing:.44px;margin-top:8px}
.hd-r{text-align:right}
.hd-r .tkr{font-size:11px;font-weight:400;color:var(--text-2);line-height:1.35}
.hd-r .px{font-size:11px;font-weight:400;color:var(--text-2);line-height:1.35}
.hd-r .px em{font-style:normal;color:var(--text-4)}
.hd-r .tags{font-size:10.5px;font-weight:400;color:var(--text-2);letter-spacing:1.26px;line-height:14.7px;margin-top:9px}
.hd-r .tags i{font-style:normal;opacity:.55;margin:0 3px}

.ftr{
  height:64px;flex:none;background:#000;border-top:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.ftr .close{font-size:15px;font-weight:400;color:var(--text-2);letter-spacing:-.3px}
.ftr .next{font-size:22px;color:#fff;letter-spacing:-.44px;opacity:.4;transition:opacity .25s;padding:6px 4px}
.ftr .next.on{opacity:1}
.ftr .next:not(.on){cursor:not-allowed}
.ftr .gate{
  font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.26px;
  position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.ftr .gate.show{opacity:1;color:var(--text-2)}
.ftr{position:relative}

/* ---------- 06: pinned summary ---------- */
.pinned{
  flex:none;background:#000;position:relative;z-index:5;
  border-bottom:1px solid var(--hairline);
  box-shadow:0 6px 18px rgba(0,0,0,.55);
}

/* 06: a slow, soft call-to-look. Two long breaths, eased both ways —
   deliberately not a blink: no hard edges, no colour shift, nothing punitive. */
@keyframes attnRail{0%,100%{background:var(--rule)}50%{background:#fff}}
@keyframes attnThumb{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 0 9px rgba(255,255,255,.13)}
}
@keyframes attnSeg{
  0%,100%{border-color:var(--hairline);background-color:transparent}
  50%{border-color:rgba(255,255,255,.42);background-color:rgba(255,255,255,.045)}
}
@keyframes attnSegText{0%,100%{color:var(--text-3)}50%{color:#fff}}
@keyframes attnVal{0%,100%{opacity:.55}50%{opacity:1}}
.attn .sl-rail    {animation:attnRail    1500ms cubic-bezier(.4,0,.2,1) 2}
.attn .sl-thumb   {animation:attnThumb   1500ms cubic-bezier(.4,0,.2,1) 2}
.attn .seg        {animation:attnSeg     1500ms cubic-bezier(.4,0,.2,1) 2}
.attn .seg button {animation:attnSegText 1500ms cubic-bezier(.4,0,.2,1) 2}
.attn .val        {animation:attnVal     1500ms cubic-bezier(.4,0,.2,1) 2}
@media (prefers-reduced-motion:reduce){
  .attn .sl-rail,.attn .sl-thumb,.attn .seg,.attn .seg button,.attn .val{animation:none}
  .attn .seg{border-color:rgba(255,255,255,.42)}
  .attn .sl-rail{background:#fff}
}

/* what's still missing, flashed on a blocked advance */
@keyframes flashmiss{0%,100%{background-color:transparent}30%{background-color:rgba(255,255,255,.09)}}
.flash-miss{animation:flashmiss .46s ease-out 2}
@keyframes flashpip{0%,100%{background:var(--hairline)}30%{background:var(--text-3)}}
.pips i:not(.on).flash-miss{animation:flashpip .46s ease-out 2;background:var(--hairline)}

.disclaimer{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:-.062px;line-height:19.38px;padding:0 var(--pad);margin:34px 0 26px}

/* ---------- shared type ---------- */
.sec-label{font-size:11px;font-weight:500;color:var(--text-3);line-height:1.25}
.sec-desc{font-size:11.5px;font-weight:300;color:var(--text-3);letter-spacing:-.057px;line-height:17.25px;margin-top:9px}
.caps{display:flex;justify-content:space-between;font-size:10px;font-weight:400;color:var(--text-3);letter-spacing:1.4px;margin-top:9px}

/* ---------- sentence ---------- */
.sentence{
  font-size:16px;font-weight:300;letter-spacing:-.24px;line-height:24px;color:#fff;
  padding:0 var(--pad);
}
.sentence b{font-weight:500;letter-spacing:-.16px}
.sentence .blank{
  font-size:15px;font-weight:400;color:var(--text-2);letter-spacing:-.15px;
  border-bottom:1px solid var(--text-2);padding:0 14px;
}
.sentence .filled{
  font-weight:500;color:#fff;letter-spacing:-.16px;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;
}

/* .rx = redesign sentences (v2..v5). v0 keeps the original flat treatment.
   Three states: recessed placeholder / recessed value / the one field in focus. */
.sentence.rx .blank{
  color:var(--text-4);border-bottom-color:var(--text-4);
  transition:color .18s,border-color .18s,background-color .18s;
}
.sentence.rx .filled{
  color:var(--text-2);font-weight:400;letter-spacing:-.15px;
  transition:color .18s,border-color .18s,background-color .18s;
}
.sentence.rx .blank.live{
  color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.05);
}
.sentence.rx .filled.live{
  color:#fff;font-weight:500;letter-spacing:-.16px;background:rgba(255,255,255,.05);
}

/* ============================================================
   SLIDER (custom — the native range can't hit these tokens)
   ============================================================ */
.sl{margin-top:16px}
.sl-hit{position:relative;height:44px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.sl-rail{position:relative;height:1px;width:100%;background:var(--rule)}
.sl-fill{position:absolute;left:0;top:0;height:1px;width:0;background:#d9d9d9;transition:width .04s linear}
.sl-thumb{
  position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:4px;background:#fff;
}

/* redesigned slider: bigger thumb, visible affordance */
.sl.big .sl-rail{height:1px}
.sl.big .sl-thumb{
  width:16px;height:16px;border-radius:8px;background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.14);transition:box-shadow .16s,width .16s,height .16s;
}
.sl.big .sl-hit:hover .sl-thumb{box-shadow:0 0 0 7px rgba(255,255,255,.08)}
.sl.big.is-drag .sl-thumb{box-shadow:0 0 0 11px rgba(255,255,255,.12)}
.sl.big:not(.is-set) .sl-thumb{background:transparent;border:1.5px solid #fff}
.sl.big:not(.is-set) .sl-fill{background:#3a3a3a}

/* grab hint that decays once touched */
.grab-hint{
  position:absolute;left:0;top:50%;transform:translate(-50%,-50%);
  width:16px;height:16px;border-radius:50%;pointer-events:none;
  animation:pulse 2.1s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}
  70%{box-shadow:0 0 0 13px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.is-set .grab-hint{display:none}

/* ---------- discrete tick scale (probability, 10% steps) ---------- */
.ticks{position:relative;height:56px;touch-action:none;cursor:pointer;margin-top:6px}
.tick{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:1px;height:14px;background:#3a3a3a;transition:.14s;
}
.tick.past{background:#6a6a6a}
.tick.sel{width:2px;height:26px;background:#fff}
.tick-tap{position:absolute;top:0;bottom:0;transform:translateX(-50%);width:34px}
.ticks.is-set .tick.hint{animation:none}
.tick.hint{animation:tickbreathe 2.4s ease-in-out infinite}
@keyframes tickbreathe{0%,100%{background:#3a3a3a}50%{background:#6f6f6f}}

/* ---------- segmented control ---------- */
.seg{display:flex;border:1px solid var(--hairline);margin-top:16px}
.seg button{
  flex:1;height:47px;font-size:13px;font-weight:300;color:var(--text-3);letter-spacing:.26px;
  border-right:1px solid var(--hairline);transition:.16s;position:relative;
}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--text-2);background:rgba(255,255,255,.02)}
.seg button.on{color:#fff;font-weight:400;background:rgba(255,255,255,.05)}

/* ---------- value readouts ---------- */
/* the one value readout in the system — node 4084:1101/1112:
   28px Inter Light, -0.56px, lh 30.8, with the unit small + grey beside it */
.val{display:inline-flex;align-items:baseline;gap:5px}
.val b{font-size:28px;font-weight:300;color:#fff;letter-spacing:-.56px;line-height:30.8px}
.val s{font-size:13px;font-weight:300;color:var(--text-3);letter-spacing:-.13px;text-decoration:none;white-space:nowrap}
.val s.w{font-size:12px;letter-spacing:-.12px}
.val.empty b{color:var(--text-4)}

/* ---------- progress pips ---------- */
.pips{display:flex;gap:5px;padding:0 var(--pad);margin-top:14px}
.pips i{flex:1;height:1px;background:var(--hairline);transition:background .3s}
.pips i.on{background:#fff}
.pips-note{font-size:10px;font-weight:400;color:var(--text-3);letter-spacing:1.4px;padding:0 var(--pad);margin-top:8px}

/* ============================================================
   V1 — LIVE SENTENCE
   ============================================================ */
.v1-lede{padding:26px var(--pad) 0}
.v1-sentence{font-size:16px;font-weight:300;letter-spacing:-.24px;line-height:34px;color:#fff}
.v1-sentence b{font-weight:500;letter-spacing:-.16px}
.chip{
  display:inline-block;font-size:13px;font-weight:400;letter-spacing:.26px;
  padding:5px 11px;border:1px solid var(--hairline);color:var(--text-3);
  transition:.16s;vertical-align:1px;
}
.chip:hover{border-color:#3d3d3d;color:var(--text-2)}
.chip.set{color:#fff;font-weight:500;border-color:rgba(255,255,255,.22)}
.chip.active{border-color:#fff;color:#fff;background:rgba(255,255,255,.05)}
.v1-panel{border-top:1px solid var(--hairline);margin-top:30px;padding:22px var(--pad) 6px}
.v1-panel .sec-label{display:flex;justify-content:space-between;align-items:baseline}
.v1-panel .sec-label span{font-size:10px;font-weight:400;color:var(--text-3);letter-spacing:1.4px}
.v1-empty{padding:26px var(--pad);border-top:1px solid var(--hairline);margin-top:30px}
.v1-empty p{font-size:11.5px;font-weight:300;color:var(--text-3);line-height:17.25px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}
.stepper button{
  width:34px;height:34px;border:1px solid var(--hairline);color:var(--text-2);
  font-size:15px;font-weight:300;transition:.16s;
}
.stepper button:hover{border-color:#3d3d3d;color:#fff}
.stepper .rd{min-width:96px;text-align:center}

/* ============================================================
   V2 — MATCHED CONTROLS
   ============================================================ */
.v2-block{padding:30px var(--pad) 0}
.v2-block + .v2-block{margin-top:8px}
.v2-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.v2-rule{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.26px;white-space:nowrap;padding-top:1px}
.v2-readout{display:flex;align-items:baseline;justify-content:space-between;margin-top:20px}
.v2-type{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.26px}
.type-btn{font-size:10px;font-weight:400;color:var(--text-3);letter-spacing:1.26px;border-bottom:1px solid var(--hairline);padding-bottom:2px;transition:.14s}
.type-btn:hover{color:#fff;border-color:#fff}

/* ============================================================
   V3 — GUIDED SEQUENCE
   ============================================================ */
.v3-list{margin-top:26px;border-top:1px solid var(--hairline)}
.v3-step{border-bottom:1px solid var(--hairline);padding:0 var(--pad)}
.v3-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 0;width:100%;text-align:left}
.v3-idx{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.4px;width:22px;flex:none}
.v3-name{flex:1;font-size:13px;font-weight:300;color:var(--text-3);letter-spacing:.26px}
.v3-step.done .v3-name{color:var(--text-2)}
.v3-step.active .v3-name{color:#fff;font-weight:400}
/* pending = not yet answered, but still open to inspect. Deliberately NOT
   disabled: browsing ahead is allowed, completing all three is the gate. */
.v3-step.pending .v3-name{color:var(--text-3)}
.v3-step.pending .v3-edit{color:var(--text-4)}
.v3-row{transition:background-color .16s}
.v3-step:not(.active) .v3-row:hover{background:rgba(255,255,255,.03)}
.v3-step.pending .v3-row:hover .v3-name,
.v3-step.pending .v3-row:hover .v3-edit{color:var(--text-2)}
.v3-step.pending .v3-row:hover .v3-edit::after{content:' 92'}
.v3-ans{font-size:13px;font-weight:500;color:#fff;letter-spacing:-.13px}
.v3-edit{font-size:10px;font-weight:400;color:var(--text-3);letter-spacing:1.26px}
.v3-open{padding:2px 0 26px}
.v3-open .sec-desc{margin-top:0;margin-bottom:4px}
.v3-done-note{padding:24px var(--pad);border-bottom:1px solid var(--hairline)}
.v3-done-note p{font-size:11.5px;font-weight:300;color:var(--text-2);line-height:17.25px}

/* ============================================================
   V4 — CARD STACK
   ============================================================ */
.v4-wrap{padding:24px var(--pad) 0;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--hairline);padding:18px 16px 8px;transition:border-color .25s}
.card.set{border-color:rgba(255,255,255,.16)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-dot{width:5px;height:5px;border-radius:50%;border:1px solid var(--text-4);margin-top:4px;transition:.25s}
.card.set .card-dot{background:#fff;border-color:#fff}
.card-val{margin-top:14px}
.val-wrap{text-align:center}
.card .sec-desc{margin-top:8px}
.receipt{
  margin:20px var(--pad) 0;border:1px solid var(--hairline);padding:18px 16px;
  transition:border-color .25s;
}
.receipt.on{border-color:rgba(255,255,255,.16)}
.receipt .rlabel{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.26px}
.receipt .sentence{padding:0;margin-top:12px;color:var(--text-4)}
.receipt.on .sentence{color:#fff}

/* ============================================================
   V5 — NUMBER FIRST
   ============================================================ */
.v5-list{margin-top:18px;border-top:1px solid var(--hairline-soft)}
.v5-row{padding:20px var(--pad);border-bottom:1px solid var(--hairline-soft)}
.v5-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;width:100%;text-align:left}
.v5-num{font-size:28px;font-weight:300;color:#fff;letter-spacing:-.56px;line-height:30.8px;white-space:nowrap}
.v5-num.empty{color:var(--text-4)}
.v5-num .u{font-size:12px;font-weight:300;color:var(--text-3);letter-spacing:-.12px;margin-left:5px}
.v5-num.editing{border-bottom:1.5px solid #fff;padding-bottom:3px}
.v5-tap{font-size:10px;font-weight:400;color:var(--text-4);letter-spacing:1.26px;margin-top:6px}
.v5-fine{margin-top:2px}
.v5-fine .sl{margin-top:4px}
.v5-fine .caps{margin-top:2px}

/* keypad / picker drawer — replicated from the Limit Order screen */
.pad{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  background:#2b2b2b;border-radius:26px 26px 0 0;padding:14px 10px 20px;
  transform:translateY(103%);transition:transform .26s cubic-bezier(.4,0,.2,1);
}
.pad.up{transform:none}
.pad-hd{display:flex;justify-content:space-between;align-items:center;padding:0 10px 12px}
.pad-hd b{font-size:11px;font-weight:500;color:#fff;letter-spacing:.2px}
.pad-hd button{font-size:12px;font-weight:400;color:#d6d6d6;letter-spacing:-.2px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{
  height:48px;background:#4a4a4a;border-radius:7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:.1s;
}
.key:active{background:#5c5c5c}
.key b{font-size:21px;font-weight:400;color:#fff;line-height:1}
.key s{font-size:8px;font-weight:500;color:#e2e2e2;letter-spacing:1.3px;text-decoration:none}
.key.blank{background:none}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{
  height:48px;background:#4a4a4a;border-radius:7px;font-size:15px;font-weight:400;color:#fff;
  transition:.1s;
}
.pick button:active{background:#5c5c5c}
.pick button.on{background:#fff;color:#000;font-weight:500}
</style>
</head>
<body>

<button class="burger" id="burger" aria-label="Switch iteration"><i></i><i></i><i></i></button>
<button class="reset-btn" id="resetTop" title="Reset this screen — keyboard: R" aria-label="Reset this screen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/>
  </svg>
</button>
<span class="reset-hint" id="resetHint"></span>
<div class="scrim" id="scrim"></div>

<nav class="drawer">
  <div class="drawer-hd">
    <h2>Prediction · Step 4 of 6</h2>
    <p>Redesign iterations</p>
  </div>
  <div class="drawer-list" id="navList"></div>
  <div class="drawer-ft">
    <button class="mini-btn" id="resetOne">Reset this</button>
    <button class="mini-btn" id="resetAll">Reset all</button>
  </div>
</nav>

<div class="stage">
  <div class="caption">
    <h3 id="capName"></h3>
    <p id="capDesc"></p>
    <p class="shortcuts">RESET <b>R</b> &nbsp;·&nbsp; SWITCH <b>0</b>–<b>6</b> or <b>&larr; &rarr;</b> &nbsp;·&nbsp; MENU <b>&#9776;</b></p>
  </div>
  <div class="phone" id="phone"></div>
</div>

<script>
/* ============================================================
   CONTENT + STATE
   ============================================================ */
const TICKER = 'AAPL';

/* exported asset — Figma node 4047:701 "Vector", 12.0489 x 12.0489, fill #fff */
const INFO_SVG = `<svg width="12.0489" height="12.0489" viewBox="0 0 12.0489 12.0489" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.68977 9.03669H6.35915V5.35508H5.68977V9.03669ZM6.31497 4.28406C6.39619 4.20507 6.4368 4.10712 6.4368 3.9902C6.4368 3.87328 6.39708 3.77555 6.31765 3.69701C6.23822 3.61847 6.14049 3.57898 6.02446 3.57853C5.90843 3.57808 5.8107 3.61758 5.73127 3.69701C5.65184 3.77644 5.61234 3.8744 5.61279 3.99087C5.61324 4.10734 5.65362 4.20507 5.73395 4.28406C5.81427 4.36305 5.91111 4.40254 6.02446 4.40254C6.13781 4.40254 6.23465 4.36305 6.31497 4.28406ZM6.02714 12.0489C5.19353 12.0489 4.41013 11.8909 3.67693 11.575C2.94373 11.2586 2.30581 10.8293 1.76316 10.2871C1.22051 9.7449 0.790989 9.10765 0.474594 8.37534C0.158198 7.64303 0 6.86008 0 6.02647C0 5.19286 0.158198 4.40968 0.474594 3.67693C0.790543 2.94373 1.21917 2.30581 1.76048 1.76316C2.30179 1.22051 2.93927 0.790989 3.67291 0.474594C4.40656 0.158198 5.18974 0 6.02245 0C6.85517 0 7.63835 0.158198 8.37199 0.474594C9.10519 0.790543 9.74311 1.2194 10.2858 1.76115C10.8284 2.30291 11.2579 2.94038 11.5743 3.67358C11.8907 4.40678 12.0489 5.18974 12.0489 6.02245C12.0489 6.85517 11.8909 7.63835 11.575 8.37199C11.259 9.10564 10.8297 9.74356 10.2871 10.2858C9.74445 10.828 9.1072 11.2575 8.37534 11.5743C7.64348 11.8912 6.86119 12.0494 6.02714 12.0489ZM6.02446 11.3795C7.51942 11.3795 8.78567 10.8608 9.82322 9.82322C10.8608 8.78567 11.3795 7.51942 11.3795 6.02446C11.3795 4.5295 10.8608 3.26325 9.82322 2.2257C8.78567 1.18816 7.51942 0.669384 6.02446 0.669384C4.5295 0.669384 3.26325 1.18816 2.2257 2.2257C1.18816 3.26325 0.669384 4.5295 0.669384 6.02446C0.669384 7.51942 1.18816 8.78567 2.2257 9.82322C3.26325 10.8608 4.5295 11.3795 6.02446 11.3795Z" fill="white"/></svg>`;

const HORIZONS = [
  {id:'1y',  label:'1 year'},
  {id:'3y',  label:'3 years'},
  {id:'5y',  label:'5+ years'}
];

const COPY = {
  prob:   {label:'Probability',   desc:'The likelihood you believe this investment achieves the selected return target over the selected horizon.'},
  hurdle: {label:'Return Target', desc:'The annual return you believe this investment can achieve.'},
  horizon:{label:'Horizon',       desc:'The period within which you expect the investment to achieve the return target.'}
};

/* Unit shown beside the big value. The sentence uses a shorter form (%/yr). */
const UNIT = {prob:'%', hurdle:'% annualized'};

/* The one value readout: 28px number + small grey unit. */
function valInner(key, s){
  if (key === 'horizon') return `<b>${horizonLabel(s.horizon) || '&mdash;'}</b>`;
  return `<b>${s[key] == null ? '&mdash;' : s[key]}</b>`
       + `<s${key === 'hurdle' ? ' class="w"' : ''}>${UNIT[key]}</s>`;
}

const DISCLAIMER = 'This prediction reflects your judgment under uncertainty, not platform forecasts or guarantees. You make the investment decision.';

const VERSIONS = [
  {id:'v0', name:'00 · Current',        blurb:'The Figma baseline, made interactive. Two identical-looking sliders with 8px thumbs, no selected state on the horizon row, no completion signal.'},
  {id:'v1', name:'01 · Live Sentence',  blurb:'The sentence is the interface. Each blank is a tappable chip; its control opens directly beneath and the sentence resolves as you set it.'},
  {id:'v2', name:'02 · Matched Controls', blurb:'Each control’s form matches its rule — probability becomes 11 discrete ticks, the hurdle stays a continuous track with a type-in escape, horizon gets a real segmented state.'},
  {id:'v3', name:'03 · Guided Sequence', blurb:'One question at a time. Answered steps collapse to a single editable line, upcoming steps stay dimmed. Nothing to scroll past, nothing to miss.'},
  {id:'v4', name:'04 · Card Stack',     blurb:'Three bordered cards, each led by a 22px value readout. Borders brighten as cards complete; the sentence moves to the bottom as a confirmation receipt.'},
  {id:'v5', name:'05 · Number First',   blurb:'Values are large tap-to-edit numbers using the numeric keypad already in the system. Probability opens an 11-value picker because its data model is discrete. Sliders demote to fine-tuning.'},
  {id:'v6', name:'06 · Pinned & Guided', blurb:'00’s exact content with two changes: the header and summary sentence are pinned so the sentence never scrolls away, and a blocked arrow carries you to the first unanswered control and breathes it twice instead of simply refusing.'}
];

const blank = () => ({prob:null, hurdle:null, horizon:null, focus:null, open:null, pad:null, draft:'', touch:null});
const S = {};
VERSIONS.forEach(v => S[v.id] = blank());

let current = 'v0';

/* ---------- formatting ---------- */
const horizonLabel = id => (HORIZONS.find(h => h.id === id) || {}).label || null;
const fmt = {
  prob:    s => s.prob    == null ? null : s.prob + '%',
  hurdle:  s => s.hurdle  == null ? null : s.hurdle + '%/yr',
  horizon: s => horizonLabel(s.horizon)
};
const complete = s => s.prob != null && s.hurdle != null && s.horizon != null;
const doneCount = s => ['prob','hurdle','horizon'].filter(k => s[k] != null).length;

/* ============================================================
   SHARED MARKUP
   ============================================================ */
function chrome(inner, opts){
  opts = opts || {};
  const head = `
    <div class="hd">
      <div class="info">${INFO_SVG}</div>
      <div class="hd-row">
        <div>
          <h1>Prediction</h1>
          <div class="stepno">4 / 6</div>
        </div>
        <div class="hd-r">
          <div class="tkr">${TICKER}</div>
          <div class="px">192.33 CAD <em>-0.01%</em></div>
          <div class="tags">Compounder <i>&middot;</i> Core Position</div>
        </div>
      </div>
    </div>`;

  const foot = `
  <div class="ftr">
    <button class="close">Close</button>
    <span class="gate" data-gate></span>
    <button class="next" data-next>&#8594;</button>
  </div>`;

  // pinned variant: header + summary sit OUTSIDE .body, so they never scroll away
  if (opts.pinned) return `
  <div class="navbar"><span class="chev">&#8249;</span></div>
  <div class="pinned">${head}${opts.pinned}</div>
  <div class="body">${inner}<div class="disclaimer">${DISCLAIMER}</div></div>
  ${foot}`;

  return `
  <div class="navbar"><span class="chev">&#8249;</span></div>
  <div class="body">
    ${head}
    ${inner}
    <div class="disclaimer">${DISCLAIMER}</div>
  </div>
  ${foot}`;
}

/* sentence — grammar cleaned up for v1..v5 so the horizon carries its own noun */
function sentenceHTML(s, focus){
  const cell = (key, w) => {
    const v = fmt[key](s);
    const live = focus === key ? ' live' : '';
    return v
      ? `<span class="filled${live}">${v}</span>`
      : `<span class="blank${live}" style="padding:0 ${w}px">&nbsp;</span>`;
  };
  return `<b>${TICKER}</b> has a ${cell('prob',14)} chance of compounding at ${cell('hurdle',18)} or more over the next ${cell('horizon',20)}.`;
}

/* Which single field is "in focus" right now, per version's own model of focus. */
function focusOf(s){
  if (current === 'v3'){
    if (s.focus) return s.focus;
    return ['prob','hurdle','horizon'].find(k => s[k] == null) || null;
  }
  if (s.pad) return s.pad;      // v5 keypad / picker open
  return s.touch;               // v2, v4, v5 — the control last engaged
}

function sliderHTML(key, opts){
  const cls = ['sl'];
  if (!opts.small) cls.push('big');
  return `
  <div class="${cls.join(' ')}" data-sl="${key}">
    <div class="sl-hit">
      <div class="sl-rail">
        <div class="sl-fill"></div>
        ${opts.small ? '' : '<div class="grab-hint"></div>'}
        <div class="sl-thumb"></div>
      </div>
    </div>
    <div class="caps"><span>${opts.lo}</span><span>${opts.hi}</span></div>
  </div>`;
}

function ticksHTML(key){
  let t = '';
  for (let i = 0; i <= 10; i++){
    const pct = i * 10;
    t += `<div class="tick" data-tick="${pct}" style="left:${i * 10}%"></div>`;
  }
  return `
  <div class="ticks" data-ticks="${key}">${t}</div>
  <div class="caps" style="margin-top:0"><span>0</span><span>100</span></div>`;
}

function segHTML(key, sel){
  return `<div class="seg" data-seg="${key}">` +
    HORIZONS.map(h => `<button data-h="${h.id}" class="${sel === h.id ? 'on' : ''}">${h.label}</button>`).join('') +
    `</div>`;
}

/* ============================================================
   V0 — CURRENT (faithful replica)
   ============================================================ */
/* v0 / v6 render the same sentence, minus the focus highlight (no .rx). */
function sentenceV0(s){ return sentenceHTML(s, null); }

function v0(s){
  const body = `
    <div class="sentence" style="margin-top:36px" data-live="sentence-v0"></div>

    <div style="padding:0 var(--pad);margin-top:56px">
      <div class="sec-label">${COPY.prob.label}</div>
      <div class="sec-desc">${COPY.prob.desc}</div>
      <div class="val-wrap" style="margin-top:22px"><span class="val" data-live="prob-val"></span></div>
      ${sliderHTML('prob', {lo:'0', hi:'100', small:true})}
    </div>

    <div style="padding:0 var(--pad);margin-top:56px">
      <div class="sec-label">${COPY.hurdle.label}</div>
      <div class="sec-desc">${COPY.hurdle.desc}</div>
      <div class="val-wrap" style="margin-top:22px"><span class="val" data-live="hurdle-val"></span></div>
      ${sliderHTML('hurdle', {lo:'15', hi:'100', small:true})}
    </div>

    <div style="padding:0 var(--pad);margin-top:56px">
      <div class="sec-label">${COPY.horizon.label}</div>
      <div class="seg" data-seg="horizon" style="margin-top:16px">
        ${HORIZONS.map(h => `<button data-h="${h.id}" class="${s.horizon === h.id ? 'on' : ''}">${h.label}</button>`).join('')}
      </div>
    </div>`;
  return chrome(body);
}

/* ============================================================
   V1 — LIVE SENTENCE
   ============================================================ */

/* ============================================================
   V6 — PINNED SUMMARY + GUIDED ADVANCE
   Content is identical to v0 on purpose: the only two changes are the pinned
   top region and what the arrow does while the form is incomplete.
   ============================================================ */
function v6(s){
  const pinned = `<div class="sentence" data-live="sentence-v0" style="margin:24px 0 22px"></div>`;
  const slid = (key, lo, hi, mt) => `
    <div data-field="${key}" style="padding:0 var(--pad);margin-top:${mt}px">
      <div class="sec-label">${COPY[key].label}</div>
      <div class="sec-desc">${COPY[key].desc}</div>
      <div class="val-wrap" style="margin-top:22px"><span class="val" data-live="${key}-val"></span></div>
      ${sliderHTML(key, {lo, hi, small:true})}
    </div>`;
  const body = `
    ${slid('prob', '0', '100', 30)}
    ${slid('hurdle', '15', '100', 56)}
    <div data-field="horizon" style="padding:0 var(--pad);margin-top:56px">
      <div class="sec-label">${COPY.horizon.label}</div>
      ${segHTML('horizon', s.horizon)}
    </div>`;
  return chrome(body, {pinned});
}

function v1(s){
  const chip = (key, placeholder) => {
    const v = fmt[key](s);
    const cls = ['chip'];
    if (v) cls.push('set');
    if (s.open === key) cls.push('active');
    return `<button class="${cls.join(' ')}" data-chip="${key}">${v || placeholder}</button>`;
  };

  let panel;
  if (!s.open){
    panel = `<div class="v1-empty"><p>${complete(s)
      ? 'Your view is complete. Tap any value above to revise it, or continue.'
      : 'Tap a value in the sentence above to set it.'}</p></div>`;
  } else if (s.open === 'prob'){
    panel = `<div class="v1-panel">
      <div class="sec-label">${COPY.prob.label}<span>10% STEPS</span></div>
      <div class="sec-desc">${COPY.prob.desc}</div>
      <div class="val-wrap" style="margin-top:20px"><span class="val" data-live="prob-val"></span></div>
      ${ticksHTML('prob')}
    </div>`;
  } else if (s.open === 'hurdle'){
    panel = `<div class="v1-panel">
      <div class="sec-label">${COPY.hurdle.label}<span>ANY VALUE</span></div>
      <div class="sec-desc">${COPY.hurdle.desc}</div>
      ${sliderHTML('hurdle', {lo:'15', hi:'100'})}
      <div class="stepper">
        <button data-nudge="hurdle:-1">&minus;</button>
        <span class="val rd" data-live="hurdle-val"></span>
        <button data-nudge="hurdle:1">+</button>
      </div>
    </div>`;
  } else {
    panel = `<div class="v1-panel">
      <div class="sec-label">${COPY.horizon.label}<span>PICK ONE</span></div>
      <div class="sec-desc">${COPY.horizon.desc}</div>
      ${segHTML('horizon', s.horizon)}
      <div style="height:14px"></div>
    </div>`;
  }

  const body = `
    <div class="v1-lede">
      <div class="v1-sentence" data-live="sentence-chips">
        <b>${TICKER}</b> has a ${chip('prob','probability')} chance of compounding at
        ${chip('hurdle','return target')} or more over the next ${chip('horizon','horizon')}.
      </div>
    </div>
    ${panel}`;
  return chrome(body);
}

/* ============================================================
   V2 — MATCHED CONTROLS
   ============================================================ */
function v2(s){
  const body = `
    <div class="pips">${[0,1,2].map(i => `<i class="${doneCount(s) > i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pips-note" data-live="pips-note"></div>

    <div class="sentence" style="margin-top:22px" data-live="sentence"></div>

    <div class="v2-block">
      <div class="v2-head">
        <div>
          <div class="sec-label">${COPY.prob.label}</div>
          <div class="sec-desc">${COPY.prob.desc}</div>
        </div>
        <div class="v2-rule">10% STEPS</div>
      </div>
      <div class="v2-readout">
        <span class="val" data-live="prob-val"></span>
        <div class="v2-type">SLIDE OR TAP A MARK</div>
      </div>
      ${ticksHTML('prob')}
    </div>

    <div class="v2-block">
      <div class="v2-head">
        <div>
          <div class="sec-label">${COPY.hurdle.label}</div>
          <div class="sec-desc">${COPY.hurdle.desc}</div>
        </div>
        <div class="v2-rule">ANY VALUE</div>
      </div>
      <div class="v2-readout">
        <span class="val" data-live="hurdle-val"></span>
        <button class="type-btn" data-pad="hurdle">TYPE A VALUE</button>
      </div>
      ${sliderHTML('hurdle', {lo:'15', hi:'100'})}
    </div>

    <div class="v2-block">
      <div class="v2-head">
        <div>
          <div class="sec-label">${COPY.horizon.label}</div>
          <div class="sec-desc">${COPY.horizon.desc}</div>
        </div>
        <div class="v2-rule">PICK ONE</div>
      </div>
      ${segHTML('horizon', s.horizon)}
    </div>`;
  return chrome(body) + padHTML();
}

/* ============================================================
   V3 — GUIDED SEQUENCE
   ============================================================ */
function v3(s){
  const order = ['prob','hurdle','horizon'];
  let active = s.focus;
  if (active == null) active = order.find(k => s[k] == null) || null;

  const control = key => {
    if (key === 'prob')   return `<div class="sec-desc">${COPY.prob.desc}</div>`
      + `<div class="val-wrap" style="margin-top:18px"><span class="val" data-live="prob-val"></span></div>`
      + ticksHTML('prob');
    if (key === 'hurdle') return `<div class="sec-desc">${COPY.hurdle.desc}</div>
        <div class="v2-readout"><span class="val" data-live="hurdle-val"></span>
        <button class="type-btn" data-pad="hurdle">TYPE A VALUE</button></div>
        ${sliderHTML('hurdle', {lo:'15', hi:'100'})}`;
    return `<div class="sec-desc">${COPY.horizon.desc}</div>${segHTML('horizon', s.horizon)}<div style="height:6px"></div>`;
  };

  const rows = order.map((key, i) => {
    const val = fmt[key](s);
    const isActive = active === key;
    const cls = ['v3-step', isActive ? 'active' : (val != null ? 'done' : 'pending')].join(' ');
    const right = isActive
      ? `<span class="v3-edit">${val || 'SET'}</span>`
      : (val != null ? `<span class="v3-ans">${val}</span><span class="v3-edit" style="margin-left:12px">EDIT</span>` : `<span class="v3-edit">&mdash;</span>`);
    return `<div class="${cls}">
      <button class="v3-row" data-step="${key}">
        <span class="v3-idx">0${i+1}</span>
        <span class="v3-name">${COPY[key].label}</span>
        <span style="display:flex;align-items:baseline">${right}</span>
      </button>
      ${isActive ? `<div class="v3-open">${control(key)}</div>` : ''}
    </div>`;
  }).join('');

  const done = complete(s) && active == null;
  const body = `
    <div class="sentence" style="margin-top:30px" data-live="sentence"></div>
    <div class="pips" style="margin-top:22px">${[0,1,2].map(i => `<i class="${doneCount(s) > i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pips-note" data-live="pips-note"></div>
    <div class="v3-list">${rows}
      ${done ? `<div class="v3-done-note"><p>All three set. Tap any row to revise, or continue to the next step.</p></div>` : ''}
    </div>`;
  return chrome(body) + padHTML();
}

/* ============================================================
   V4 — CARD STACK
   ============================================================ */
function v4(s){
  const card = (key, ctrl, rule) => `
    <div class="card ${s[key] != null ? 'set' : ''}">
      <div class="card-top">
        <div>
          <div class="sec-label">${COPY[key].label}</div>
        </div>
        <div style="display:flex;align-items:center;gap:9px">
          <span class="v2-rule">${rule}</span>
          <span class="card-dot"></span>
        </div>
      </div>
      <div class="card-val"><span class="val" data-live="${key}-val"></span></div>
      <div class="sec-desc">${COPY[key].desc}</div>
      ${ctrl}
    </div>`;

  const body = `
    <div class="v4-wrap">
      ${card('prob', ticksHTML('prob'), '10% STEPS')}
      ${card('hurdle', sliderHTML('hurdle', {lo:'15', hi:'100'}) + '<div style="height:6px"></div>', 'ANY VALUE')}
      ${card('horizon', segHTML('horizon', s.horizon) + '<div style="height:10px"></div>', 'PICK ONE')}
    </div>
    <div class="receipt ${complete(s) ? 'on' : ''}">
      <div class="rlabel">YOUR PREDICTION</div>
      <div class="sentence" data-live="sentence"></div>
    </div>`;
  return chrome(body);
}

/* ============================================================
   V5 — NUMBER FIRST
   ============================================================ */
function v5(s){
  const row = (key, unit, tap, fine) => {
    const v = fmt[key](s);
    const raw = key === 'horizon' ? horizonLabel(s.horizon) : s[key];
    const editing = s.pad === key;
    const shown = editing && s.draft !== '' ? s.draft : (raw == null ? '—' : raw);
    return `
    <div class="v5-row">
      <button class="v5-top" data-pad="${key}">
        <div>
          <div class="sec-label">${COPY[key].label}</div>
          <div class="v5-tap">${tap}</div>
        </div>
        <div class="v5-num ${raw == null && !editing ? 'empty' : ''} ${editing ? 'editing' : ''}">${shown}${unit && (raw != null || editing) ? `<span class="u">${unit}</span>` : ''}</div>
      </button>
      ${fine || ''}
    </div>`;
  };

  const body = `
    <div class="sentence" style="margin-top:28px" data-live="sentence"></div>
    <div class="v5-list">
      ${row('prob', '%', 'TAP TO PICK &middot; 10% STEPS',
        `<div class="v5-fine">${ticksHTML('prob')}</div>`)}
      ${row('hurdle', '% annualized', 'TAP TO TYPE &middot; ANY VALUE',
        `<div class="v5-fine">${sliderHTML('hurdle', {lo:'15', hi:'100'})}</div>`)}
      <div class="v5-row">
        <div class="sec-label">${COPY.horizon.label}</div>
        <div class="v5-tap">PICK ONE</div>
        ${segHTML('horizon', s.horizon)}
        <div style="height:4px"></div>
      </div>
    </div>`;
  return chrome(body) + padHTML();
}

/* ---------- keypad / picker drawer ---------- */
const KEYS = [
  ['1',''],['2','ABC'],['3','DEF'],
  ['4','GHI'],['5','JKL'],['6','MNO'],
  ['7','PQRS'],['8','TUV'],['9','WXYZ'],
  ['','' ],['0',''],['del','']
];
function padHTML(){
  const s = S[current];
  const isProb = s.pad === 'prob';
  const open = s.pad != null;
  let inner;
  if (isProb){
    let cells = '';
    for (let i = 0; i <= 10; i++){
      const v = i * 10;
      cells += `<button data-pick="${v}" class="${s.prob === v ? 'on' : ''}">${v}%</button>`;
    }
    inner = `<div class="pick">${cells}</div>`;
  } else {
    inner = `<div class="keys">${KEYS.map(([d,l]) =>
      d === '' ? `<div class="key blank"></div>`
      : d === 'del' ? `<button class="key" data-key="del"><b>&#9003;</b></button>`
      : `<button class="key" data-key="${d}"><b>${d}</b>${l ? `<s>${l}</s>` : ''}</button>`
    ).join('')}</div>`;
  }
  return `<div class="pad ${open ? 'up' : ''}">
    <div class="pad-hd">
      <b>${open ? COPY[s.pad].label : ''}</b>
      <button data-padclose>Done</button>
    </div>
    ${inner}
  </div>`;
}

const BUILD = {v0, v1, v2, v3, v4, v5, v6};

/* ============================================================
   RENDER + LIVE SYNC
   ============================================================ */
const phone = document.getElementById('phone');

/* Rebuilding replaces .body, which would silently reset scrollTop to 0.
   Carry the offset across so an in-place edit never yanks the user to the top. */
function render(){
  const s = S[current];
  const before = phone.querySelector('.body');
  const keep = before ? before.scrollTop : 0;
  phone.innerHTML = `<div class="screen on">${BUILD[current](s)}</div>`;
  wire();
  sync();
  if (keep){
    const after = phone.querySelector('.body');
    if (after) after.scrollTop = keep;
  }
}

function sync(){
  const s = S[current];
  const q = sel => phone.querySelectorAll(sel);

  const focus = focusOf(s);
  q('[data-live="sentence"]').forEach(el => {
    el.classList.add('rx');
    el.innerHTML = sentenceHTML(s, focus);
  });
  q('[data-live="sentence-v0"]').forEach(el => el.innerHTML = sentenceV0(s));

  // v1 chips — keep the sentence resolving while a control is being dragged
  q('[data-live="sentence-chips"]').forEach(el => {
    el.querySelectorAll('[data-chip]').forEach(c => {
      const k = c.dataset.chip;
      const v = fmt[k](s);
      c.textContent = v || {prob:'probability', hurdle:'return target', horizon:'horizon'}[k];
      c.classList.toggle('set', v != null);
      c.classList.toggle('active', s.open === k);
    });
  });

  ['prob','hurdle','horizon'].forEach(key => {
    const html = valInner(key, s);
    q(`[data-live="${key}-val"]`).forEach(el => {
      el.classList.toggle('empty', s[key] == null);
      el.innerHTML = html;
    });
  });

  q('.pips').forEach(el => {
    const n = doneCount(s);
    [...el.children].forEach((pip, i) => pip.classList.toggle('on', i < n));
  });

  q('[data-live="pips-note"]').forEach(el => {
    el.textContent = complete(s) ? 'ALL SET' : `${doneCount(s)} OF 3 SET`;
  });

  q('[data-next]').forEach(el => {
    const ok = complete(s);
    el.classList.toggle('on', ok);
    el.setAttribute('aria-disabled', String(!ok));
  });
  q('.card').forEach(c => {
    const k = c.querySelector('[data-live]');
    if (k) c.classList.toggle('set', s[k.dataset.live.split('-')[0]] != null);
  });

  // ticks
  q('.ticks').forEach(t => {
    t.classList.toggle('is-set', s.prob != null);
    t.querySelectorAll('.tick').forEach(k => {
      const v = +k.dataset.tick;
      k.classList.toggle('sel', s.prob === v);
      k.classList.toggle('past', s.prob != null && v < s.prob);
      k.classList.toggle('hint', s.prob == null);
    });
  });

  // sliders
  q('.sl').forEach(el => {
    const key = el.dataset.sl;
    const cfg = key === 'hurdle' ? {min:15, max:100} : {min:0, max:100};
    const set = s[key] != null;
    el.classList.toggle('is-set', set);
    const p = set ? (s[key] - cfg.min) / (cfg.max - cfg.min) : 0;
    el.querySelector('.sl-fill').style.width = (p * 100) + '%';
    el.querySelector('.sl-thumb').style.left = (p * 100) + '%';
    const g = el.querySelector('.grab-hint');
    if (g) g.style.left = (p * 100) + '%';
  });

  q('.receipt').forEach(el => el.classList.toggle('on', complete(s)));
}

/* ---------- interaction wiring ---------- */
function wire(){
  const s = S[current];

  // sliders (pointer driven)
  phone.querySelectorAll('.sl').forEach(el => {
    const key = el.dataset.sl;
    const cfg = key === 'hurdle' ? {min:15, max:100, step:1} : {min:0, max:100, step:10};
    const hit = el.querySelector('.sl-hit');
    const rail = el.querySelector('.sl-rail');
    let dragging = false;

    const valueAt = clientX => {
      const r = rail.getBoundingClientRect();
      let p = (clientX - r.left) / r.width;
      p = Math.max(0, Math.min(1, p));
      let v = cfg.min + p * (cfg.max - cfg.min);
      v = Math.round(v / cfg.step) * cfg.step;
      return Math.max(cfg.min, Math.min(cfg.max, v));
    };

    hit.addEventListener('pointerdown', e => {
      dragging = true;
      hit.setPointerCapture(e.pointerId);
      el.classList.add('is-drag');
      s.touch = key;
      s[key] = valueAt(e.clientX);
      sync();
    });
    hit.addEventListener('pointermove', e => {
      if (!dragging) return;
      const v = valueAt(e.clientX);
      if (v !== s[key]){ s[key] = v; sync(); }
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('is-drag');
      if (current === 'v3'){ s.focus = null; render(); }
    };
    hit.addEventListener('pointerup', end);
    hit.addEventListener('pointercancel', end);
  });

  // discrete tick scale
  phone.querySelectorAll('.ticks').forEach(el => {
    let dragging = false;
    const valueAt = clientX => {
      const r = el.getBoundingClientRect();
      let p = (clientX - r.left) / r.width;
      p = Math.max(0, Math.min(1, p));
      return Math.round(p * 10) * 10;
    };
    el.addEventListener('pointerdown', e => {
      dragging = true;
      el.setPointerCapture(e.pointerId);
      s.touch = 'prob';
      s.prob = valueAt(e.clientX);
      sync();
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const v = valueAt(e.clientX);
      if (v !== s.prob){ s.prob = v; sync(); }
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (current === 'v1'){ s.open = s.hurdle == null ? 'hurdle' : (s.horizon == null ? 'horizon' : null); render(); }
      if (current === 'v3'){ s.focus = null; render(); }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });

}

/* All three must be set to advance. Browsing is free; continuing is not. */
/* 06: don't just refuse — carry the user to the first thing that's missing. */
function guideToFirstMissing(){
  const s = S[current];
  const key = ['prob','hurdle','horizon'].find(k => s[k] == null);
  if (!key) return;
  const scroller = phone.querySelector('.body');
  const target = phone.querySelector(`[data-field="${key}"]`);
  if (!scroller || !target) return;

  const sr = scroller.getBoundingClientRect(), tr = target.getBoundingClientRect();
  const top = scroller.scrollTop + (tr.top - sr.top) - (scroller.clientHeight - tr.height) / 2;
  scroller.scrollTo({top: Math.max(0, top), behavior: 'smooth'});

  clearTimeout(guideToFirstMissing.t1);
  clearTimeout(guideToFirstMissing.t2);
  phone.querySelectorAll('.attn').forEach(el => el.classList.remove('attn'));
  // let the scroll land first, so the pulse is seen rather than scrolled past
  guideToFirstMissing.t1 = setTimeout(() => {
    target.classList.add('attn');
    guideToFirstMissing.t2 = setTimeout(() => target.classList.remove('attn'), 3200);
  }, 420);
}

function nudgeIncomplete(){
  const s = S[current];
  if (current === 'v6') return guideToFirstMissing();
  const missing = ['prob','hurdle','horizon'].filter(k => s[k] == null);
  const gate = phone.querySelector('[data-gate]');
  if (gate){
    gate.textContent = missing.length === 3
      ? 'SET ALL THREE TO CONTINUE'
      : `${missing.map(k => COPY[k].label.toUpperCase()).join(' + ')} STILL NEEDED`;
    gate.classList.add('show');
    clearTimeout(nudgeIncomplete.t);
    nudgeIncomplete.t = setTimeout(() => gate.classList.remove('show'), 2200);
  }
  const marks = [
    ...phone.querySelectorAll('.v3-step.pending, .card:not(.set), .chip:not(.set)'),
    ...phone.querySelectorAll('[data-live] .blank'),
    ...phone.querySelectorAll('.pips i:not(.on)')
  ];
  marks.forEach(el => {
    el.classList.remove('flash-miss');
    void el.offsetWidth;              // restart the animation
    el.classList.add('flash-miss');
    setTimeout(() => el.classList.remove('flash-miss'), 1000);
  });
}

/* delegated taps — attached ONCE; render() only swaps innerHTML */
phone.addEventListener('click', e => {
  const s = S[current];
  {
    const next = e.target.closest('[data-next]');
    if (next){
      if (!complete(s)) nudgeIncomplete();
      return;
    }
    const seg = e.target.closest('[data-seg] button');
    if (seg){
      s.horizon = seg.dataset.h;
      s.touch = 'horizon';
      // v1 and v3 reflow (panel swap / step advance), so they must rebuild
      if (current === 'v1'){
        s.open = s.prob == null ? 'prob' : (s.hurdle == null ? 'hurdle' : null);
        render(); return;
      }
      if (current === 'v3'){ s.focus = null; render(); return; }
      // everywhere else nothing moves — just repaint the selection
      seg.parentElement.querySelectorAll('button')
        .forEach(b => b.classList.toggle('on', b === seg));
      sync();
      return;
    }
    const chip = e.target.closest('[data-chip]');
    if (chip){ s.open = s.open === chip.dataset.chip ? null : chip.dataset.chip; render(); return; }

    const step = e.target.closest('[data-step]');
    if (step){
      s.focus = s.focus === step.dataset.step ? null : step.dataset.step;
      s.touch = s.focus; render(); return;
    }

    const nudge = e.target.closest('[data-nudge]');
    if (nudge){
      const [k, d] = nudge.dataset.nudge.split(':');
      const min = k === 'hurdle' ? 15 : 0;
      const base = s[k] == null ? min : s[k];
      s[k] = Math.max(min, Math.min(100, base + (+d)));
      sync();
      return;
    }

    const padBtn = e.target.closest('[data-pad]');
    if (padBtn){ s.pad = padBtn.dataset.pad; s.touch = s.pad; s.draft = ''; render(); return; }

    if (e.target.closest('[data-padclose]')){ commitDraft(); s.pad = null; s.draft = ''; render(); return; }

    const pick = e.target.closest('[data-pick]');
    if (pick){ s.prob = +pick.dataset.pick; s.pad = null; render(); return; }

    const key = e.target.closest('[data-key]');
    if (key){
      const d = key.dataset.key;
      if (d === 'del') s.draft = s.draft.slice(0, -1);
      else if (s.draft.length < 3) s.draft = (s.draft === '0' ? '' : s.draft) + d;
      const el = phone.querySelector('.v5-num.editing');
      if (el) el.innerHTML = (s.draft || '&mdash;') + '<span class="u">% annualized</span>';
      const lg = phone.querySelector('[data-live="hurdle-val"]');
      if (lg && s.draft) lg.innerHTML = `<b>${s.draft}</b><s class="w">${UNIT.hurdle}</s>`;
      return;
    }
  }
});

function commitDraft(){
  const s = S[current];
  if (s.pad && s.pad !== 'prob' && s.draft !== ''){
    const min = 15;
    s[s.pad] = Math.max(min, Math.min(100, parseInt(s.draft, 10) || min));
  }
}

/* ============================================================
   NAV
   ============================================================ */
const navList = document.getElementById('navList');
navList.innerHTML = VERSIONS.map(v =>
  `<button class="nav-item" data-v="${v.id}"><b>${v.name}</b><s>${v.blurb}</s></button>`
).join('');

function setVersion(id){
  current = id;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  const meta = VERSIONS.find(v => v.id === id);
  document.getElementById('capName').textContent = meta.name;
  document.getElementById('capDesc').textContent = meta.blurb;
  render();
  const b = phone.querySelector('.body');
  if (b) b.scrollTop = 0;
}

navList.addEventListener('click', e => {
  const b = e.target.closest('[data-v]');
  if (!b) return;
  setVersion(b.dataset.v);
  document.body.classList.remove('nav-open');
});

document.getElementById('burger').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
function resetCurrent(label){
  S[current] = blank();
  const sc = phone.querySelector('.body');
  render();
  if (sc) { const b = phone.querySelector('.body'); if (b) b.scrollTop = 0; }
  const hint = document.getElementById('resetHint');
  hint.textContent = label;
  hint.classList.add('show');
  clearTimeout(resetCurrent.t);
  resetCurrent.t = setTimeout(() => hint.classList.remove('show'), 1400);
}
document.getElementById('resetTop').addEventListener('click', () => resetCurrent('SCREEN RESET'));
document.getElementById('resetOne').addEventListener('click', () => { S[current] = blank(); render(); });
document.getElementById('resetAll').addEventListener('click', () => { VERSIONS.forEach(v => S[v.id] = blank()); render(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.body.classList.remove('nav-open');
  if (/^[0-6]$/.test(e.key)) setVersion('v' + e.key);
  if (e.key === 'r' || e.key === 'R') resetCurrent('SCREEN RESET');
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const i = VERSIONS.findIndex(v => v.id === current);
    const n = (i + (e.key === 'ArrowRight' ? 1 : VERSIONS.length - 1)) % VERSIONS.length;
    setVersion(VERSIONS[n].id);
  }
});

setVersion('v0');
</script>
